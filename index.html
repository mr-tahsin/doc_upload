<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Management</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1>Document Management</h1>
          <p>Upload and manage school documents</p>
        </div>
      </div>

      <div class="content-wrapper">
        <!-- ================= LEFT SIDE ================= -->
        <div class="form-card">
          <div class="card-header">
            <h2 id="formTitle">Add Document</h2>
          </div>

          <form id="documentForm">
            <!-- Document Name -->
            <div class="form-group">
              <label for="documentName">
                Document Name
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="documentName"
                placeholder="Enter document name"
                maxlength="150"
                required
              />
            </div>

            <!-- Document Attachment -->
            <div class="form-group">
              <label for="documentFile">
                Document Attachment
                <span class="required">*</span>
              </label>

              <div class="file-input-wrapper">
                <input
                  type="file"
                  id="documentFile"
                  accept=".pdf,.doc,.docx,.xlsx"
                />
              </div>

              <small class="help-text">
                Maximum file size: 10 MB
                <br />
                Supported formats: PDF, DOC, DOCX, XLSX
              </small>

              <div id="selectedFile" class="selected-file"></div>
            </div>

            <!-- Privacy -->
            <div class="form-group">
              <label for="privacy">
                Privacy
                <span class="required">*</span>
              </label>

              <div class="multi-select" id="privacyDropdown">
                <div class="multi-select-header" id="privacyHeader">
                  <span id="privacyPlaceholder"> Select privacy roles </span>

                  <span class="dropdown-arrow">▼</span>
                </div>

                <div class="multi-select-options" id="privacyOptions">
                  <label class="checkbox-option">
                    <input type="checkbox" value="All" />
                    <span>All</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" value="Parents" />
                    <span>Parents</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" value="Principal" />
                    <span>Principal</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" value="Teacher" />
                    <span>Teacher</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" value="Admin" />
                    <span>Admin</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" value="Print" />
                    <span>Print</span>
                  </label>
                </div>
              </div>

              <div id="selectedPrivacy" class="selected-privacy"></div>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
              <button type="submit" class="btn btn-save" id="submitBtn">
                Save
              </button>

              <button type="button" class="btn btn-reset" id="resetBtn">
                Reset
              </button>
            </div>
          </form>
        </div>

        <!-- ================= RIGHT SIDE ================= -->
        <div class="list-card">
          <div class="card-header list-header">
            <div>
              <h2>Document List</h2>
              <p id="documentCount">7 documents</p>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>SL</th>
                  <th>Document Name</th>
                  <th>Attachment</th>
                  <th>Privacy</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="documentTableBody">
                <!-- Data generated by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
  </body>
</html>
